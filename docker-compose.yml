services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_assistant_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  brain:
    build: ./brain
    container_name: whatsapp_brain
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - MIX_ENV=prod
      - DATABASE_URL=ecto://postgres:postgres@db:5432/house_assistant_dev
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_SERVER=true
      - BRIDGE_SEND_URL=${BRIDGE_SEND_URL:-http://bridge:3000/send}
      - BRIDGE_LEAVE_URL=${BRIDGE_LEAVE_URL:-http://bridge:3000/leave}
      - BRIDGE_AUTH_TOKEN=${BRIDGE_AUTH_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: whatsapp_bridge
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - ELIXIR_WEBHOOK_URL=${ELIXIR_WEBHOOK_URL:-http://brain:4000/webhook/whatsapp}
      - BRIDGE_AUTH_TOKEN=${BRIDGE_AUTH_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    volumes:
      - baileys_auth:/app/.wwebjs_auth
    depends_on:
      - brain
    restart: unless-stopped

volumes:
  baileys_auth:
  postgres_data:
