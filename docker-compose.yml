services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_assistant_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: whatsapp_bridge
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ELIXIR_WEBHOOK_URL=${ELIXIR_WEBHOOK_URL:-http://brain:4000/webhook/whatsapp}
      - TARGET_GROUP_ID=${TARGET_GROUP_ID:-}
    volumes:
      - baileys_auth:/app/.wwebjs_auth
    restart: unless-stopped

  brain:
    build: ./brain
    container_name: whatsapp_brain
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - BRIDGE_SEND_URL=${BRIDGE_SEND_URL:-http://bridge:3000/send}
      - DATABASE_URL=ecto://postgres:postgres@db:5432/house_assistant_dev
      - PHX_SERVER=true
    depends_on:
      - db
    restart: unless-stopped

volumes:
  baileys_auth:
  postgres_data:
